<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#d4af37">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CECYTEM 101">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CECYTEM Ecatepec II - Portal Grupo 101</title>
  <!-- Iconos Boxicons para el ojo de contraseña -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- SDK Supabase JS -->
  <script src="supabase.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #09131d;
      padding: 15px;
      color: #fff;
      position: relative;
    }

    /* --- NOTIFICACIÓN ESTILO CELESTE CON ANIMACIÓN DE CARTA SALIENDO --- */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      max-width: 420px;
      pointer-events: none;
    }

    .toast {
      background: rgba(10, 23, 36, 0.95);
      border: 1.5px solid #00d2ff;
      box-shadow: 0 0 18px rgba(0, 210, 255, 0.4);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      opacity: 0;
      transform: translateY(-30px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Contenedor gráfico del Sobre */
    .envelope-wrapper {
      position: relative;
      width: 38px;
      height: 28px;
      background: #00d2ff;
      border-radius: 4px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 210, 255, 0.3);
      overflow: visible;
    }

    /* Tapa del sobre */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 19px solid transparent;
      border-right: 19px solid transparent;
      border-top: 15px solid #0099cc;
      transform-origin: top;
      transition: transform 0.35s ease-in-out;
      z-index: 3;
    }

    .toast.show .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Cuerpo frontal del sobre */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #00bfff;
      clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
      border-radius: 0 0 4px 4px;
      z-index: 2;
    }

    /* Carta animada que sale del sobre */
    .envelope-letter {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 20px;
      background: #ffffff;
      border-radius: 2px;
      z-index: 2;
      transition: transform 0.4s ease 0.25s, opacity 0.3s ease;
      opacity: 0;
      box-shadow: 0 -1px 4px rgba(0,0,0,0.2);
    }

    /* Líneas simulación texto de la carta */
    .envelope-letter::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 20px;
      height: 2px;
      background: #00d2ff;
      box-shadow: 0 4px 0 #94a3b8, 0 8px 0 #94a3b8;
    }

    /* Animación: La carta emerge verticalmente */
    .toast.show .envelope-letter {
      opacity: 1;
      transform: translate(-50%, -14px);
    }

    .toast-message {
      font-size: 13px;
      color: #ffffff;
      font-weight: 500;
      line-height: 1.35;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    .container {
      width: 100%;
      max-width: 850px;
      min-height: 520px;
      background: #0a1724;
      border: 2px solid #eab308;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(234, 179, 8, 0.25);
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .left-panel {
      width: 45%;
      background: #0d1e2e;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logos-container {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 65px;
      height: 65px;
      object-fit: contain;
      background: #fff;
      padding: 4px;
      border-radius: 8px;
    }

    .left-panel h1 {
      color: #eab308;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .left-panel p {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      border: 1px solid #eab308;
      color: #eab308;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 15px;
    }

    .right-panel {
      width: 55%;
      padding: 40px 35px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .form-box {
      width: 100%;
    }

    .form-box h2 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .input-group {
      margin-bottom: 16px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      height: 44px;
      background: #071018;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 0 40px 0 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-curp {
      text-transform: uppercase;
    }

    .input-group input:focus {
      border-color: #eab308;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      bottom: 10px;
      font-size: 20px;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
      transition: color 0.3s ease;
    }

    .toggle-password:hover {
      color: #eab308;
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: #eab308;
      color: #09131d;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      background: #facc15;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .toggle-text {
      font-size: 13px;
      text-align: center;
      color: #94a3b8;
      margin-top: 18px;
    }

    .toggle-text a {
      color: #eab308;
      text-decoration: none;
      font-weight: 600;
    }

    .toggle-text a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        max-width: 440px;
        min-height: auto;
      }

      .left-panel {
        width: 100%;
        padding: 25px 20px;
        border-right: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      .right-panel {
        width: 100%;
        padding: 25px 20px;
      }
    }
    @media (max-width: 768px) {
      body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); align-items: flex-start; }
      .input-group input { font-size: 16px; height: 48px; }
      .btn-submit { height: 48px; }
    }
    body { min-height: 100vh; min-height: 100dvh; }
  </style>
</head>
<body>

  <!-- CONTENEDOR NOTIFICACIONES ANIMADAS -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">
    
    <div class="left-panel">
      <div class="logos-container">
        <img src="cecytem_logo.png" alt="Logo CECYTEM" class="logo-img">
        <img src="comite_logo.png" alt="Logo Comité Grupo 101" class="logo-img">
      </div>
      <h1>CECYTEM Ecatepec II</h1>
      <p>Comité de Representación Estudiantil - Grupo 101 Programación.<br>Gestión académica, horarios y control interno.</p>
      <div class="badge">Técnico en Programación</div>
    </div>

    <div class="right-panel">

      <!-- FORMULARIO 1: REGISTRARSE -->
      <div class="form-box" id="box-register">
        <h2>Registro Grupo 101</h2>
        <form id="form-register">
          <div class="input-group">
            <label>No. Control Escolar</label>
            <input type="text" id="reg-control" placeholder="Ej. 26415082270124" inputmode="numeric" autocomplete="username">
          </div>
          <div class="input-group">
            <label>Nombre Completo</label>
            <input type="text" id="reg-nombre" placeholder="Nombre(s) y Apellidos">
          </div>
          <div class="input-group">
            <label>Correo Institucional</label>
            <input type="email" id="reg-email" placeholder="alumno@cecytem.edu.mx">
          </div>
          <div class="input-group">
            <label>CURP (Contraseña)</label>
            <input type="password" id="reg-curp" class="input-curp" placeholder="Tu CURP (18 caracteres)" maxlength="18" autocomplete="new-password">
            <i class='bx bx-hide toggle-password' onclick="togglePasswordVisibility('reg-curp', this)"></i>
          </div>
          <button type="submit" class="btn-submit">Registrarse</button>
          <button type="button" class="btn-submit" style="margin-top:10px;background:#d4af37;color:#070b12" onclick="location.href='dashboard.html'">ENTRAR A LA DEMO (sin cuenta)</button>
          <p class="toggle-text">¿Ya tienes cuenta? <a href="javascript:void(0)" id="link-to-login">Inicia sesión</a></p>
        </form>
      </div>

      <!-- FORMULARIO 2: INICIAR SESIÓN -->
      <div class="form-box hidden" id="box-login">
        <h2>Acceso</h2>
        <form id="form-login">
          <div class="input-group">
            <label>No. Control Escolar</label>
            <input type="text" id="login-control" placeholder="Ingresa tu No. de Control" inputmode="numeric" autocomplete="username">
          </div>
          <div class="input-group">
            <label>CURP (Contraseña)</label>
            <input type="password" id="login-curp" class="input-curp" placeholder="Ingresa tu CURP" maxlength="18" autocomplete="current-password">
            <i class='bx bx-hide toggle-password' onclick="togglePasswordVisibility('login-curp', this)"></i>
          </div>
          <button type="submit" class="btn-submit">INGRESAR</button>
          <button type="button" class="btn-submit" style="margin-top:10px;background:#d4af37;color:#070b12" onclick="location.href='dashboard.html'">ENTRAR A LA DEMO (sin cuenta)</button>
          <p class="toggle-text">¿No tienes cuenta? <a href="javascript:void(0)" id="link-to-register">Registrarse</a></p>
        </form>
      </div>

    </div>

  </div>

  <script>
    // FUNCIÓN PARA VER / OCULTAR CONTRASEÑA
    function togglePasswordVisibility(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') { input.type = 'text'; icon.classList.replace('bx-hide','bx-show'); }
      else { input.type = 'password'; icon.classList.replace('bx-show','bx-hide'); }
    }

    document.querySelectorAll('.input-curp').forEach(input => input.addEventListener('input', e => e.target.value = e.target.value.toUpperCase()));

    function showNotification(message) {
      const container = document.getElementById('toastContainer'); container.innerHTML = '';
      const toast = document.createElement('div'); toast.className = 'toast';
      toast.innerHTML = `<div class="envelope-wrapper"><div class="envelope-flap"></div><div class="envelope-letter"></div><div class="envelope-pocket"></div></div><div class="toast-message">${String(message).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`;
      container.appendChild(toast); setTimeout(() => toast.classList.add('show'), 50);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 4500);
    }

    const boxRegister = document.getElementById('box-register'), boxLogin = document.getElementById('box-login');
    document.getElementById('link-to-login').addEventListener('click', () => { boxRegister.classList.add('hidden'); boxLogin.classList.remove('hidden'); });
    document.getElementById('link-to-register').addEventListener('click', () => { boxLogin.classList.add('hidden'); boxRegister.classList.remove('hidden'); });

    ['form-register','form-login'].forEach(id => document.getElementById(id).addEventListener('submit', e => {
      e.preventDefault();
      localStorage.setItem('usuarioActual', JSON.stringify(PERFIL_DEMO));
      location.href = 'dashboard.html';
    }));
  </script>
<script src="app.js"></script>
</body>
</html>
